<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicotine Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; margin: 0; font-family: 'Inter', sans-serif; }
        .info-text { font-variant-numeric: tabular-nums; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 dark:bg-gray-900 flex items-center justify-center h-full">

    <div class="text-center p-8 flex flex-col items-center w-full max-w-xs">
        
        <!-- Zone d'information -->
        <div id="infoDisplay" class="text-center mb-8 p-4 rounded-lg w-full transition-colors duration-500 bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-gray-200">
            <!-- Ligne 0: Nombre de prises -->
            <div>
                <p class="font-semibold text-sm text-gray-600 dark:text-gray-400"><span class="text-2xl align-middle mr-1">🔢</span> Nombre de prises</p>
                <p id="dailyCountText" class="info-text font-bold text-2xl mt-1">--</p>
            </div>
            <div class="border-t border-gray-300 dark:border-gray-600 my-3"></div>
            <!-- Ligne 1: Dernière prise -->
            <div>
                <p class="font-semibold text-sm text-gray-600 dark:text-gray-400">
                    <span id="statusEmoji" class="text-2xl align-middle mr-1">⚪</span>Dernière prise
                </p>
                <p id="lastClickText" class="info-text font-bold text-2xl mt-1">--:--</p>
            </div>
            <div class="border-t border-gray-300 dark:border-gray-600 my-3"></div>
            <!-- Ligne 2: Moyenne -->
            <div>
                <p class="font-semibold text-sm text-gray-600 dark:text-gray-400"><span class="text-2xl align-middle mr-1">⏱️</span> Moyenne du jour</p>
                <p id="averageText" class="info-text font-bold text-2xl mt-1">-- min</p>
            </div>
            <div class="border-t border-gray-300 dark:border-gray-600 my-3"></div>
            <!-- Ligne 3: Prochaine prise -->
            <div>
                <p class="font-semibold text-sm text-gray-600 dark:text-gray-400"><span class="text-2xl align-middle mr-1">🎯</span> Prochaine prise (est.)</p>
                <p id="nextDoseText" class="info-text font-bold text-2xl mt-1">--:--</p>
            </div>
        </div>

        <!-- Bouton d'action principal -->
        <button id="logButton" class="w-48 h-48 bg-blue-600 text-white rounded-full shadow-lg transform transition-all duration-200 ease-in-out hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-800 flex items-center justify-center">
            <span id="buttonText" class="text-2xl font-semibold">Nicotine</span>
        </button>

        <!-- Bouton de téléchargement CSV -->
        <button id="downloadCsvBtn" class="mt-8 text-sm font-medium text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200 underline transition-colors cursor-pointer">
            Télécharger l'historique (CSV)
        </button>
    </div>

    <!-- Conteneur pour les erreurs (remplace l'alert bloquant) -->
    <div id="errorToast" class="fixed bottom-4 right-4 bg-red-600 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        <span id="errorMessage">Une erreur est survenue.</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, setDoc, increment, onSnapshot, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURATION FIREBASE ---
        // ⚠️ COPIEZ-COLLEZ VOS VRAIES CLÉS DEPUIS LA CONSOLE FIREBASE ICI :
        const firebaseConfig = {
            apiKey: "AIzaSyCrt95VbVp7LakUndL8GClmFwqkvqwrJOc",
            authDomain: "nicotine-89e91.firebaseapp.com",
            projectId: "nicotine-89e91",
            storageBucket: "nicotine-89e91.firebasestorage.app",
            messagingSenderId: "848128559093",
            appId: "1:848128559093:web:6b64805437a7f4b7f742bc"
        };

        const appId = 'nicotine-tracker';

        // Initialisation de Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // 💡 L'ASTUCE : On utilise un ID fixe (en dur) pour synchroniser tous vos appareils sans mot de passe
        // On n'utilise PAS auth.currentUser.uid ici, sinon le téléphone et le PC auraient des dossiers séparés.
        const userId = "mon_profil_personnel"; 

        const logButton = document.getElementById('logButton');
        const buttonText = document.getElementById('buttonText');
        const infoDisplay = document.getElementById('infoDisplay');
        const dailyCountText = document.getElementById('dailyCountText');
        const statusEmoji = document.getElementById('statusEmoji');
        const lastClickText = document.getElementById('lastClickText');
        const averageText = document.getElementById('averageText');
        const nextDoseText = document.getElementById('nextDoseText');
        const errorToast = document.getElementById('errorToast');
        const errorMessage = document.getElementById('errorMessage');
        const downloadCsvBtn = document.getElementById('downloadCsvBtn');

        // --- VARIABLES D'ÉTAT ---
        let currentDailyCount = 0;
        let currentLastClickDate = null;
        let currentAvgDurationSeconds = 0;
        let updateInterval;

        // Fonction pour afficher une erreur discrète en bas de l'écran
        function showError(msg) {
            errorMessage.textContent = msg;
            errorToast.classList.remove('opacity-0');
            setTimeout(() => errorToast.classList.add('opacity-0'), 5000);
        }

        // Formater la date en YYYY-MM-DD pour les statistiques quotidiennes
        function getTodayDateString() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Mise à jour de l'interface utilisateur avec les dernières données
        function updateDisplayStatus() {
            if (currentDailyCount === 0 || !currentLastClickDate) {
                dailyCountText.textContent = '0';
                lastClickText.textContent = "Aucune aujourd'hui";
                averageText.textContent = "-- min";
                nextDoseText.textContent = "--:--";
                statusEmoji.textContent = '⚪';
                infoDisplay.className = "text-center mb-8 p-4 rounded-lg w-full transition-colors duration-500 bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-gray-200";
                return;
            }

            dailyCountText.textContent = currentDailyCount;
            lastClickText.textContent = currentLastClickDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            
            if (currentAvgDurationSeconds > 0) {
                averageText.textContent = `${Math.round(currentAvgDurationSeconds / 60)} min`;
                const nextDoseDate = new Date(currentLastClickDate.getTime() + currentAvgDurationSeconds * 1000);
                nextDoseText.textContent = nextDoseDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                
                const elapsedSeconds = (Date.now() - currentLastClickDate.getTime()) / 1000;
                if (elapsedSeconds > currentAvgDurationSeconds) {
                    infoDisplay.className = "text-center mb-8 p-4 rounded-lg w-full transition-colors duration-500 bg-green-100 dark:bg-green-900 text-green-700 dark:text-green-300";
                    statusEmoji.textContent = '✅';
                } else {
                    infoDisplay.className = "text-center mb-8 p-4 rounded-lg w-full transition-colors duration-500 bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-300";
                    statusEmoji.textContent = '⏳';
                }
            } else {
                averageText.textContent = "-- min";
                nextDoseText.textContent = "--:--";
            }
        }

        function listenToTodayData() {
            const startOfDay = new Date();
            startOfDay.setHours(0, 0, 0, 0);

            // On pointe vers le dossier unique commun à tous vos appareils
            const logsRef = collection(db, 'artifacts', appId, 'users', userId, 'logs');

            onSnapshot(logsRef, (snapshot) => {
                const logs = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.timestamp) {
                        const date = data.timestamp.toDate();
                        if (date >= startOfDay) {
                            logs.push(date);
                        }
                    }
                });

                logs.sort((a, b) => a.getTime() - b.getTime());

                currentDailyCount = logs.length;

                if (currentDailyCount > 0) {
                    currentLastClickDate = logs[logs.length - 1];
                    const firstClickDate = logs[0];

                    if (currentDailyCount > 1) {
                        const totalSeconds = (currentLastClickDate.getTime() - firstClickDate.getTime()) / 1000;
                        currentAvgDurationSeconds = totalSeconds / (currentDailyCount - 1);
                    } else {
                        currentAvgDurationSeconds = 0;
                    }
                } else {
                    currentLastClickDate = null;
                    currentAvgDurationSeconds = 0;
                }

                updateDisplayStatus();
                clearInterval(updateInterval);
                updateInterval = setInterval(updateDisplayStatus, 1000);

            }, (error) => {
                console.error("Erreur de synchronisation:", error);
                showError("Erreur de connexion. Avez-vous mis vos clés API ?");
            });
        }

        // Démarrage de l'écoute après la connexion silencieuse (anonyme)
        window.addEventListener('load', async () => {
            try {
                // Connecte cet appareil de façon transparente pour avoir les droits Firebase
                await signInAnonymously(auth);
                
                // Une fois authentifié, on lit le dossier PARTAGÉ (userId = "mon_profil_personnel")
                if (auth.currentUser) {
                    listenToTodayData();
                }
            } catch (error) {
                console.error("Erreur de connexion :", error);
                showError("Impossible de se connecter au serveur.");
            }
        });

        // Action principale : enregistrer une prise
        logButton.addEventListener('click', async () => {
            // Sécurité : on vérifie que l'appareil est bien connecté à Firebase
            if (!auth.currentUser) return showError("En attente de connexion...");

            logButton.disabled = true;
            buttonText.textContent = '...';
            
            try {
                // 1. Sauvegarde de la prise individuelle pour calculer les moyennes
                const logsRef = collection(db, 'artifacts', appId, 'users', userId, 'logs');
                await addDoc(logsRef, {
                    timestamp: serverTimestamp()
                });

                // 2. Mise à jour incrémentale du compteur quotidien (parfait pour l'export CSV)
                const todayString = getTodayDateString();
                const dailyStatRef = doc(db, 'artifacts', appId, 'users', userId, 'daily_stats', todayString);
                
                await setDoc(dailyStatRef, {
                    date: todayString,
                    total_count: increment(1),
                    last_updated: serverTimestamp()
                }, { merge: true });

            } catch (error) {
                console.error("Erreur lors de l'enregistrement :", error);
                showError("Erreur lors de l'enregistrement.");
            } finally {
                setTimeout(() => {
                    logButton.disabled = false;
                    buttonText.textContent = 'Nicotine';
                }, 300);
            }
        });

        // Action secondaire : télécharger l'historique CSV
        downloadCsvBtn.addEventListener('click', async () => {
            try {
                const originalText = downloadCsvBtn.textContent;
                downloadCsvBtn.textContent = "Préparation du fichier...";
                downloadCsvBtn.disabled = true;

                const dailyStatsRef = collection(db, 'artifacts', appId, 'users', userId, 'daily_stats');
                const querySnapshot = await getDocs(dailyStatsRef);

                let dataRows = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.date && data.total_count) {
                        dataRows.push({ date: data.date, count: data.total_count });
                    }
                });

                // Tri chronologique des dates
                dataRows.sort((a, b) => a.date.localeCompare(b.date));

                let csvContent = "Date,Nombre de prises\n";
                dataRows.forEach(row => {
                    csvContent += `${row.date},${row.count}\n`;
                });

                // Création et téléchargement du fichier CSV
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                
                const today = new Date().toISOString().split('T')[0];
                link.setAttribute("download", `nicotine_historique_${today}.csv`);
                
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                downloadCsvBtn.textContent = originalText;
                downloadCsvBtn.disabled = false;

            } catch (error) {
                console.error("Erreur CSV :", error);
                showError("Erreur lors de la création du fichier CSV.");
                downloadCsvBtn.disabled = false;
                downloadCsvBtn.textContent = "Télécharger l'historique (CSV)";
            }
        });
    </script>
</body>
</html>
